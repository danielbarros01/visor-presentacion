
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor de captura</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #202124;
    font-family: Arial, sans-serif;
  }

  .toolbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 58px;
    background: #303134;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    z-index: 10;
  }

  button {
    padding: 9px 17px;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
  }

  .viewer {
    position: fixed;
    top: 58px;
    bottom: 0;
    left: 0;
    right: 0;
    overflow: auto;
    text-align: center;
  }

  img {
    display: block;
    width: 100%;
    max-width: none;
    height: auto;
    margin: 0 auto;
  }
</style>
</head>

<body>

<div class="toolbar">
  <button onclick="changeZoom(-0.2)">−</button>
  <button onclick="changeZoom(0.2)">+</button>
  <button onclick="resetZoom()">Ajustar</button>
</div>

<div class="viewer" id="viewer">
  <img id="capture" src="1.png">
</div>

<script>
  let scale = 1;

  const viewer = document.getElementById("viewer");
  const img = document.getElementById("capture");

  function updateImage() {
    img.style.width = (viewer.clientWidth * scale) + "px";
  }

  function changeZoom(amount) {
    scale = Math.max(0.4, Math.min(3, scale + amount));
    updateImage();
  }

  function resetZoom() {
    scale = 1;
    updateImage();
    viewer.scrollTo({top: 0, left: 0, behavior: "smooth"});
  }

  img.onload = updateImage;
  window.addEventListener("resize", updateImage);
</script>

</body>
</html>
